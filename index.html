<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ঢাকা ডিজিটাল ডায়াগনস্টিক সেন্টার, ফরিদপুর | Dhaka Digital Diagnostic Center</title>
  <meta name="description" content="ঢাকা ডিজিটাল ডায়াগনস্টিক সেন্টার, ফরিদপুর — প্যাথলজি, এক্স-রে, ইসিজি, আল্ট্রাসনোগ্রাম ও বিশেষজ্ঞ ডাক্তারদের চেম্বার। Dhaka Digital Diagnostic Center, Jhiltuli, Faridpur.">
  <meta name="theme-color" content="#0f7a3a">
  <meta property="og:title" content="ঢাকা ডিজিটাল ডায়াগনস্টিক সেন্টার, ফরিদপুর">
  <meta property="og:description" content="একটি স্বয়ংসম্পূর্ণ অত্যাধুনিক কম্পিউটারাইজড ডিজিটাল ডায়াগনস্টিক সেন্টার">
  <meta property="og:image" content="assets/images/cover.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

  <!-- ===== Header ===== -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="#home" class="brand">
        <img src="assets/images/logo.jpg" alt="" class="brand__logo" width="44" height="44">
        <span class="brand__text">
          <strong data-site="name"></strong>
          <small data-site="city"></small>
        </span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#home" data-i18n="nav_home"></a>
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#doctors" data-i18n="nav_doctors"></a>
        <a href="#gallery" data-i18n="nav_gallery"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
      </nav>

      <div class="header__actions">
        <div class="lang" role="group" aria-label="Language">
          <button type="button" data-lang="bn">বাং</button>
          <button type="button" data-lang="en">EN</button>
        </div>
        <button class="menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false" aria-controls="nav">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main>
    <!-- ===== Hero ===== -->
    <section class="hero" id="home">
      <div class="hero__bg" aria-hidden="true"></div>
      <div class="container hero__inner">
        <div class="hero__text reveal">
          <p class="eyebrow" data-i18n="hero_eyebrow"></p>
          <h1><span data-site="name"></span><span class="hero__city" data-site="city"></span></h1>
          <p class="hero__tagline" data-site="tagline"></p>
          <div class="hero__cta">
            <a class="btn btn--primary js-serial-link" href="#">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
              <span data-i18n="hero_call"></span>
            </a>
            <a class="btn btn--ghost" href="#doctors" data-i18n="hero_doctors"></a>
          </div>
        </div>

        <aside class="hero__card reveal">
          <img src="assets/images/logo.jpg" alt="Dhaka Digital Diagnostic Center logo" class="hero__logo" width="120" height="120">
          <div class="info-row">
            <span class="info-row__label" data-i18n="serial_label"></span>
            <a class="info-row__value js-serial-link js-serial-text" href="#"></a>
          </div>
          <div class="info-row">
            <span class="info-row__label" data-i18n="address_label"></span>
            <span class="info-row__value info-row__value--sm" data-site="address"></span>
          </div>
        </aside>
      </div>

      <div class="container">
        <ul class="highlights" id="highlights"></ul>
      </div>
    </section>

    <!-- ===== Services ===== -->
    <section class="section" id="services">
      <div class="container">
        <header class="section__head reveal">
          <p class="kicker" data-i18n="services_kicker"></p>
          <h2 data-i18n="services_title"></h2>
          <p class="section__sub" data-i18n="services_sub"></p>
        </header>
        <div class="services" id="servicesGrid"></div>
      </div>
    </section>

    <!--
      FUTURE: fee list. When ready, fill "fee" in SERVICES (js/data.js);
      fees will then show on each service card automatically.
    -->

    <!-- ===== Doctors ===== -->
    <section class="section section--tint" id="doctors">
      <div class="container">
        <header class="section__head reveal">
          <p class="kicker" data-i18n="doctors_kicker"></p>
          <h2 data-i18n="doctors_title"></h2>
          <p class="section__sub note" data-i18n="doctors_note"></p>
        </header>

        <div class="doctor-tools">
          <input type="search" id="doctorSearch" class="search" data-i18n-placeholder="search_placeholder" aria-label="Search">
          <div class="chips" id="specialtyChips" role="group"></div>
        </div>

        <div class="doctors" id="doctorsGrid"></div>
        <p class="empty" id="doctorsEmpty" data-i18n="no_results" hidden></p>
      </div>
    </section>

    <!-- ===== Gallery ===== -->
    <section class="section" id="gallery">
      <div class="container">
        <header class="section__head reveal">
          <p class="kicker" data-i18n="gallery_kicker"></p>
          <h2 data-i18n="gallery_title"></h2>
        </header>
        <div class="gallery" id="galleryGrid"></div>
      </div>
    </section>

    <!-- ===== Contact ===== -->
    <section class="section section--tint" id="contact">
      <div class="container">
        <header class="section__head reveal">
          <p class="kicker" data-i18n="contact_kicker"></p>
          <h2 data-i18n="contact_title"></h2>
        </header>

        <div class="contact">
          <div class="contact__info reveal">
            <div class="contact__block">
              <h3 data-i18n="address_label"></h3>
              <p data-site="address"></p>
              <a class="link" id="mapLink" target="_blank" rel="noopener" data-i18n="directions"></a>
            </div>
            <div class="contact__block contact__block--serial">
              <h3 data-i18n="serial_label"></h3>
              <a class="big-phone js-serial-link js-serial-text" href="#"></a>
            </div>
            <div class="contact__block">
              <h3 data-i18n="contact_people"></h3>
              <ul class="people" id="contactPeople"></ul>
            </div>
            <div class="contact__block">
              <h3 data-i18n="email_label"></h3>
              <a class="link link--break" id="emailLink"></a>
            </div>
          </div>
          <div class="contact__map reveal">
            <iframe id="mapFrame" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <img src="assets/images/logo.jpg" alt="" width="40" height="40">
        <div>
          <strong data-site="name"></strong>
          <small data-site="city"></small>
        </div>
      </div>
      <nav class="footer__links">
        <a href="#services" data-i18n="nav_services"></a>
        <a href="#doctors" data-i18n="nav_doctors"></a>
        <a href="#gallery" data-i18n="nav_gallery"></a>
        <a href="#contact" data-i18n="nav_contact"></a>
        <a id="facebookLink" target="_blank" rel="noopener" hidden>Facebook</a>
      </nav>
      <p class="footer__copy">© <span id="year"></span> <span data-site="name"></span> · <span data-i18n="footer_rights"></span></p>
    </div>
  </footer>

  <!-- Floating call button (mobile) -->
  <a class="fab js-serial-link" href="#" aria-label="Call">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
  </a>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox__close" id="lightboxClose" data-i18n-aria="close">&times;</button>
    <figure>
      <img id="lightboxImg" alt="">
      <figcaption id="lightboxCaption"></figcaption>
    </figure>
  </div>

  <script src="js/data.js?v=2"></script>
  <script src="js/main.js?v=2"></script>
</body>
</html>
